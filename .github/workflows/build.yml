name: Nexzy Money Build Check

on:
  push:
    branches:
      - phase-2-tax-engine

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
